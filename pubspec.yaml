name: sona
description: Government Noise Monitoring Station Agent

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio
  record: ^6.1.1
  flutter_audio_capture: ^1.1.8

  # Networking
  http: ^1.2.2
  dio: ^5.9.0

  # State / utilities
  provider: ^6.1.5
  uuid: ^4.5.1
  logger: ^2.6.1

  # Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  geolocator: ^14.0.2

  # Charts
  fl_chart: ^1.1.1
  syncfusion_flutter_gauges: ^33.2.12

  # Database + Services
  postgres: ^3.5.12
  noise_meter: ^5.0.0
  mailer: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - images/blink.png
    - icon/bicon.png


flutter_launcher_icons:
  image_path: "icon/bicon.png"

  macos:
    generate: true